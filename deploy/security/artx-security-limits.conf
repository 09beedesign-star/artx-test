# Included from nginx http context. Empty keys are not counted by limit_req.
map $request_uri $artx_security_auth_key {
    default "";
    ~^/api/auth/(login|sms-login|email-login|sms-send-code|email-send-code)$ $binary_remote_addr;
}

map $request_uri $artx_security_api_key {
    default "";
    ~^/api/ $binary_remote_addr;
}

limit_req_zone $artx_security_auth_key zone=artx_security_auth:10m rate=10r/m;
limit_req_zone $artx_security_api_key zone=artx_security_api:10m rate=120r/m;
