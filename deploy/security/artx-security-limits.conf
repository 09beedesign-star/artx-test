# Included from nginx http context. Empty keys are not counted by limit_req.
map $request_uri $artx_security_auth_key {
    default "";
    ~^/api/auth/(login|sms-login|email-login|sms-send-code|email-send-code)$ $binary_remote_addr;
}

# 2026-11-14：图片代理从通用 API 桶里拆出来。灵感页一屏就要并发拉几十张代理图，
# 与普通 API 共用 120r/m 的桶时，用户刚打开页面就被 nginx 429，卡片停在「待加载」。
# ⚠️ map 的正则按出现顺序匹配、先中先停 → 图片代理那行必须在 ~^/api/ 之前。
map $request_uri $artx_security_api_key {
    default "";
    ~^/api/images/proxy "";
    ~^/api/ $binary_remote_addr;
}

# 图片代理是开放代理（任意 URL），不能完全豁免 → 单独一个宽松的桶。
map $request_uri $artx_security_image_key {
    default "";
    ~^/api/images/proxy $binary_remote_addr;
}

limit_req_zone $artx_security_auth_key zone=artx_security_auth:10m rate=10r/m;
limit_req_zone $artx_security_api_key zone=artx_security_api:10m rate=120r/m;
limit_req_zone $artx_security_image_key zone=artx_security_image:10m rate=1200r/m;
# 站点 server 块需同时有：limit_req zone=artx_security_image burst=300 nodelay;
