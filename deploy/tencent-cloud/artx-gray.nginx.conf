server {
    listen 80;
    server_name backstage.artxsd.com gray.artxsd.com;

    root /opt/artx-gray-backend/current/dist/public;
    index index.html;

    client_max_body_size 60m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    location = /api/health {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /entry-loader.js {
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /deployment.json {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    location /inspiration-images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # ⚠️ 入口 HTML 绝不能被浏览器缓存，删掉这两行会导致「发了版但用户看不到」。
        # 原因：/assets/ 的文件名带内容哈希（index-XXXX.js），所以可以 immutable 缓存
        # 30 天；而 index.html 是「当前该用哪个 assets 文件名」的唯一索引。
        # 若 index.html 不发缓存头，浏览器会启发式缓存它（通常按 Last-Modified 推算），
        # 用户于是拿着旧索引去请求早已被新版部署删掉的旧产物 —— 那些 URL 现在返回 404，
        # 页面就永远停在旧版本，且控制台只有 404、看不出是缓存问题。
        # no-cache 不等于不缓存：它要求每次都带 ETag 回源校验，
        # 内容没变返回 304（不耗流量），变了才返回 200。
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
