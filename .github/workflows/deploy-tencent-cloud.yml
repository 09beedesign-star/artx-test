name: Deploy Tencent Cloud Test

on:
  push:
    branches:
      - feature/interaction-framework
      - test/feature/interaction-framework
  workflow_dispatch:
    inputs:
      run_full_smoke:
        description: "Run Skill image and Wallyt callback smoke after deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: tencent-cloud-test
  cancel-in-progress: true

env:
  PUBLIC_URL: https://backstage.artxsd.com
  SERVER_HOST: 43.161.241.133
  SERVER_PORT: "22"
  SERVER_USER: root
  APP_BASE: /opt/artx-gray-backend
  DATA_DIR: /var/lib/artx-gray
  SERVICE_NAME: artx-gray-backend.service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Check skills
        run: pnpm run check:skills

      - name: Package release
        env:
          RELEASE_NAME: artx-backstage-${{ github.sha }}
          GRAY_PUBLIC_URL: ${{ env.PUBLIC_URL }}
        run: pnpm run package:tencent-cloud

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TENCENT_CLOUD_SSH_PRIVATE_KEY }}
        run: |
          test -n "${SSH_PRIVATE_KEY}" || (echo "Missing secret TENCENT_CLOUD_SSH_PRIVATE_KEY" >&2; exit 1)
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/tencent_cloud_deploy_key
          chmod 600 ~/.ssh/tencent_cloud_deploy_key
          ssh-keyscan -p "${SERVER_PORT}" "${SERVER_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          RELEASE_NAME: artx-backstage-${{ github.sha }}
        run: |
          scp -i ~/.ssh/tencent_cloud_deploy_key -P "${SERVER_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "output/tencent-cloud/${RELEASE_NAME}.tar.gz" \
            "${SERVER_USER}@${SERVER_HOST}:/tmp/${RELEASE_NAME}.tar.gz"

      - name: Activate release
        env:
          RELEASE_NAME: artx-backstage-${{ github.sha }}
        run: |
          ssh -i ~/.ssh/tencent_cloud_deploy_key -p "${SERVER_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            "RELEASE_NAME='${RELEASE_NAME}' APP_BASE='${APP_BASE}' DATA_DIR='${DATA_DIR}' SERVICE_NAME='${SERVICE_NAME}' bash -s" <<'REMOTE'
          set -euo pipefail
          release="${RELEASE_NAME}"
          base="${APP_BASE}"
          data="${DATA_DIR}"
          service="${SERVICE_NAME}"

          mkdir -p "${base}/releases" "${data}/uploads" /var/log/artx
          rm -rf "${base}/releases/${release}"
          tar -xzf "/tmp/${release}.tar.gz" -C "${base}/releases"

          if [[ -f "${base}/current/.env.gray" ]]; then
            cp "${base}/current/.env.gray" "${base}/releases/${release}/.env.gray"
          else
            echo "Missing ${base}/current/.env.gray on server" >&2
            exit 1
          fi
          if [[ -f "${base}/current/.env" ]]; then
            cp "${base}/current/.env" "${base}/releases/${release}/.env"
          fi

          chown -R root:artx "${base}/releases/${release}"
          chmod -R g+rX,o-rwx "${base}/releases/${release}"
          ln -sfn "${base}/releases/${release}" "${base}/current"

          cd "${base}/current"
          pnpm install --prod --frozen-lockfile
          systemctl restart "${service}"
          sleep 2
          systemctl is-active "${service}"
          curl -fsS http://127.0.0.1:3002/api/health
          REMOTE

      - name: Verify public smoke
        env:
          RUN_FULL_SMOKE: ${{ github.event.inputs.run_full_smoke || 'false' }}
        run: |
          ssh -i ~/.ssh/tencent_cloud_deploy_key -p "${SERVER_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            "RUN_FULL_SMOKE='${RUN_FULL_SMOKE}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/artx-gray-backend/current
          set -a
          . ./.env.gray
          set +a
          if [[ "${RUN_FULL_SMOKE}" == "true" ]]; then
            RUN_AUTH=1 RUN_WALLYT_CALLBACK=1 RUN_SKILL_IMAGE=1 \
              BACKEND_URL=https://backstage.artxsd.com \
              PUBLIC_URL=https://backstage.artxsd.com \
              SKILL_TIMEOUT_MS=240000 \
              node scripts/verify-tencent-cloud-gray.mjs
          else
            BACKEND_URL=https://backstage.artxsd.com \
              PUBLIC_URL=https://backstage.artxsd.com \
              node scripts/verify-tencent-cloud-gray.mjs
          fi
          REMOTE

      - name: Verify deployment metadata
        run: |
          metadata="$(curl -fsS https://backstage.artxsd.com/deployment.json)"
          echo "${metadata}"
          printf '%s' "${metadata}" | node -e '
            let input = "";
            process.stdin.on("data", d => input += d);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              if (data.backendUrl !== "https://backstage.artxsd.com") {
                console.error(`Unexpected backendUrl: ${data.backendUrl}`);
                process.exit(1);
              }
            });
          '
