name: Deploy Tencent Cloud Test

on:
  push:
    branches:
      - main
      - feature/interaction-framework
      - test/feature/interaction-framework
  workflow_dispatch:
    inputs:
      run_full_smoke:
        description: "Run Skill image and Wallyt callback smoke after deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

# ⚠️ cancel-in-progress 必须保持 false，不要改回 true。
#
# 背景：2026-09-13 连续三个提交推到 main 都没上线，线上停在 7fab8b5。
# 原因是 "Sync Main to Test Framework" 把 main 同步到 feature/interaction-framework，
# 同步产生的 push 又触发同一条 deploy workflow。两条抢同一个 group，
# 当时 cancel-in-progress: true → 后到的把 main 那条正在跑的直接 cancel 掉。
# 现象极具迷惑性：Actions 列表里确实有一条 success（那是 Sync 那条），
# 真正的 Deploy 是 cancelled，而 cancelled 不发失败通知，静默丢部署。
#
# ⚠️ group 必须保持全局单一，不能按 github.ref 拆开：
# 部署目标是单机全栈（43.161.241.133），两条并发会在 ln -sfn current 和
# systemctl restart 上打架。共享资源是那台机器，不是分支。
# 正确解法是「排队」而不是「取消」：慢一点，但一条都不会丢。
concurrency:
  group: tencent-cloud-test
  cancel-in-progress: false

env:
  # 正式对外域名。backstage.artxsd.com 是老入口，线上已 301 收口到 www，
  # 产物里的规范地址必须写 www，否则 deployment.json 会继续对外宣称老域名。
  PUBLIC_URL: https://www.artxsd.com
  SERVER_HOST: 43.161.241.133
  SERVER_PORT: "22"
  SERVER_USER: root
  APP_BASE: /opt/artx-gray-backend
  DATA_DIR: /var/lib/artx-gray
  SERVICE_NAME: artx-gray-backend.service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Check skills
        run: pnpm run check:skills

      # ⚠️⚠️ RELEASE_NAME 必须带 github.run_id，不要退回纯 github.sha。
      #
      # 背景（2026-09-13，连续两次线上事故同一个根因）：
      # "Sync Main to Test Framework" 会把 main 同步到 feature 分支，同步产生的 push
      # 再次触发本 workflow —— 于是**同一个 commit sha 会有两条 deploy run**。
      # 当 RELEASE_NAME 只由 sha 决定时，两条 run 算出的目录名完全相同，
      # 而 Activate 的第一步就是 `rm -rf "${base}/releases/${release}"`。
      # 后跑的那条会把**前一条刚部署好、且 current 正指向的现役目录**整个删掉，
      # 再用 tar 包重新解压 —— tar 包里既没有 node_modules 也没有 .env.gray。
      #
      # 两次事故都是它：
      #   第一次 → node_modules 被铲成空 → 全站 JSON POST 400（"pnpm 明明报了
      #            +604/Done in 4.2s 却没落盘"的悬案，真相是装完被删）
      #   第二次 → .env.gray 被铲掉 → 后续每次部署都卡在 "Missing current/.env.gray"，
      #            形成死锁（拷贝源就是被删的那个文件）
      #
      # ⚠️ 把 concurrency 从 cancel 改成排队并不能解决它，反而让两条同 sha 的 run
      # 必然先后执行，把这个坑踩实。唯一正解是让每条 run 拥有独立目录。
      - name: Package release
        env:
          RELEASE_NAME: artx-backstage-${{ github.sha }}-${{ github.run_id }}
          GRAY_PUBLIC_URL: ${{ env.PUBLIC_URL }}
          # 标记这是腾讯云生产构建，让 deployment.json 的 environment 落到 "production"
          # 而不是兜底的 "local"（vite.config.ts getBuildMetadata）。
          ARTX_DEPLOY_TARGET: tencent-cloud
        run: pnpm run package:tencent-cloud

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TENCENT_CLOUD_SSH_PRIVATE_KEY }}
        run: |
          test -n "${SSH_PRIVATE_KEY}" || (echo "Missing secret TENCENT_CLOUD_SSH_PRIVATE_KEY" >&2; exit 1)
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/tencent_cloud_deploy_key
          chmod 600 ~/.ssh/tencent_cloud_deploy_key
          ssh-keyscan -p "${SERVER_PORT}" "${SERVER_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          RELEASE_NAME: artx-backstage-${{ github.sha }}-${{ github.run_id }}
        run: |
          scp -i ~/.ssh/tencent_cloud_deploy_key -P "${SERVER_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "output/tencent-cloud/${RELEASE_NAME}.tar.gz" \
            "${SERVER_USER}@${SERVER_HOST}:/tmp/${RELEASE_NAME}.tar.gz"

      - name: Activate release
        env:
          RELEASE_NAME: artx-backstage-${{ github.sha }}-${{ github.run_id }}
        run: |
          ssh -i ~/.ssh/tencent_cloud_deploy_key -p "${SERVER_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            "RELEASE_NAME='${RELEASE_NAME}' APP_BASE='${APP_BASE}' DATA_DIR='${DATA_DIR}' SERVICE_NAME='${SERVICE_NAME}' bash -s" <<'REMOTE'
          set -euo pipefail
          release="${RELEASE_NAME}"
          base="${APP_BASE}"
          data="${DATA_DIR}"
          service="${SERVICE_NAME}"

          mkdir -p "${base}/releases" "${data}/uploads" /var/log/artx

          # ⚠️ 安全闸：绝不允许 rm -rf 掉 current 正指向的现役目录。
          # RELEASE_NAME 带上 run_id 后理论上不会再撞，但这行是最后一道保险——
          # 删掉现役目录的代价是站点被掏空（node_modules / .env.gray 全没），
          # 且 systemd 还在跑，症状极隐蔽。宁可中止部署，也不能铲现役。
          target="${base}/releases/${release}"
          if [[ -L "${base}/current" ]]; then
            live="$(readlink -f "${base}/current")"
            if [[ "$(readlink -f "${target}" 2>/dev/null || echo "${target}")" == "${live}" ]]; then
              echo "拒绝删除 current 正指向的目录：${live}" >&2
              exit 1
            fi
          fi
          rm -rf "${target}"
          tar -xzf "/tmp/${release}.tar.gz" -C "${base}/releases"

          # ⚠️ 凭据的权威来源是 ${base}/.env.gray（父目录那份长期文件），
          # 不是 current/.env.gray。
          #
          # 理由一：current 指向 releases/ 下的某个目录，而 releases/ 是会被轮转、
          # 会被 rm -rf 的临时区（轮转实现见本文件末尾「轮转旧 release」一段；
          # ⚠️ 2026-09-24 之前这句话是**空头支票**——注释写着会轮转，代码里却没有，
          # 于是堆了 261 个 release 吃掉 45G。注释描述的行为必须有代码兜底）。
          # 一旦那份被删（见上面 RELEASE_NAME 的事故说明），
          # 「从 current 拷贝」就会死锁——拷贝源正是被删掉的那个文件，
          # 此后每次部署都失败，且无法自愈，只能人工 SSH 补文件。
          # 理由二：systemd 最终加载的就是 ${base}/.env.gray（EnvironmentFile 顺序
          # 靠后、覆盖同名键），拿它当源天然和运行时一致，不会漂移。
          #
          # 保留 current/.env.gray 作为回退，只为兼容父目录那份尚未建立的旧机器。
          if [[ -f "${base}/.env.gray" ]]; then
            cp "${base}/.env.gray" "${base}/releases/${release}/.env.gray"
          elif [[ -f "${base}/current/.env.gray" ]]; then
            echo "（回退：${base}/.env.gray 不存在，改用 current/.env.gray）"
            cp "${base}/current/.env.gray" "${base}/releases/${release}/.env.gray"
          else
            echo "Missing both ${base}/.env.gray and ${base}/current/.env.gray on server" >&2
            exit 1
          fi
          if [[ -f "${base}/.env" ]]; then
            cp "${base}/.env" "${base}/releases/${release}/.env"
          elif [[ -f "${base}/current/.env" ]]; then
            cp "${base}/current/.env" "${base}/releases/${release}/.env"
          fi

          # ⚠️ 模型能力凭证门禁 —— 位置是刻意的，不要挪动。
          #
          # 必须夹在「.env.gray 已拷进新 release」之后、「ln -sfn 切换 current」之前：
          #   - 放更早 → 新 release 里还没有 .env.gray，检查的是空气；
          #   - 放更晚 → current 已经指向新版本，凭证缺失时站点当场出不了图，
          #     门禁就从"阻止事故"退化成"事后播报事故"。
          # 现在这个顺序下，校验失败时 current 仍指向旧的可用版本，站点毫发无伤。
          #
          # 背景：脚本 2026-09-12 就写好了，但一直只被 cp 进发布包、从没被调用过——
          # "有脚本"和"有门禁"是两回事。
          #
          # ⚠️ 这个检查只验证变量存在且非空，不做鉴权：key 过期 / 余额耗尽 / 上游宕机
          # 它一律报 OK。它能挡住的是"凭证漏配"这一类，不是"模型不可用"。
          # ⚠️ 必须按 systemd 的加载顺序合并两个 .env.gray 再校验，不能只查 release 里那份。
          # systemd 顺序加载 current/.env.gray 然后 ${base}/.env.gray，**后者覆盖前者**。
          # 而部署只把 current/.env.gray 拷进新 release，父目录那份从不参与拷贝，
          # 两者随时可能漂移。只查 release 里那份 = 校验的不是真正生效的配置。
          echo "--- 模型能力凭证门禁（切换 current 之前）---"
          merged_env="$(mktemp)"
          trap 'rm -f "${merged_env}"' EXIT
          cat "${base}/releases/${release}/.env.gray" > "${merged_env}"
          if [[ -f "${base}/.env.gray" ]]; then
            echo "（已叠加 ${base}/.env.gray —— 该文件最终生效，覆盖同名键）"
            cat "${base}/.env.gray" >> "${merged_env}"
          fi
          # 解析器后出现的键覆盖先出现的，与 systemd 的语义一致。
          ( cd "${base}/releases/${release}" && node scripts/verify-model-env.mjs --file "${merged_env}" )

          # ⚠️ 依赖安装与完整性门禁 —— 必须在 ln -sfn 切换 current 之前，理由同上。
          #
          # 背景：2026-09-13 一次部署后 node_modules 是空的（0 个包），
          # 但 pnpm 在 Actions 日志里明明打印了 "+604 / Done in 4.2s"，
          # systemctl is-active 正常、/api/health 也返回 200 —— 全绿上线。
          #
          # 后果是全站**所有带 JSON body 的 POST 全部变成 400**（含登录）：
          # dist/index.js 是 bundle，多数代码已内联，但 body-parser 会在运行时
          # 动态 require iconv-lite/encodings，文件不在就抛
          # "Cannot find module '../encodings'"，Express 兜底成 400 HTML。
          # 而 GET 不解析 body，所以健康检查永远发现不了。
          #
          # 📌 教训：健康检查只证明"进程活着"，不证明"依赖装全了"。
          # 原先 pnpm install 跑在切换之后且无任何校验，装空了也照样上线。
          ( cd "${base}/releases/${release}" && pnpm install --prod --frozen-lockfile )

          echo "--- 依赖完整性门禁（切换 current 之前）---"
          rel_modules="${base}/releases/${release}/node_modules"
          test -d "${rel_modules}/.pnpm" || { echo "node_modules/.pnpm 缺失，依赖未正确安装" >&2; exit 1; }
          pkg_count="$(ls "${rel_modules}" | wc -l)"
          echo "顶层包数：${pkg_count}"
          [ "${pkg_count}" -gt 10 ] || { echo "依赖数量异常(${pkg_count})，疑似安装未落盘" >&2; exit 1; }
          ls -d "${rel_modules}"/.pnpm/iconv-lite@*/node_modules/iconv-lite/encodings >/dev/null 2>&1 \
            || { echo "iconv-lite/encodings 缺失 —— 所有 JSON POST 都会 400" >&2; exit 1; }

          chown -R root:artx "${base}/releases/${release}"
          chmod -R g+rX,o-rwx "${base}/releases/${release}"
          ln -sfn "${base}/releases/${release}" "${base}/current"

          cd "${base}/current"
          systemctl restart "${service}"
          sleep 2
          systemctl is-active "${service}"
          curl -fsS http://127.0.0.1:3002/api/health

          # ⚠️ 必须额外打一个带 JSON body 的 POST。
          # 只验 /api/health（GET）会漏掉 body 解析链路故障，见上面注释。
          # 未登录时期望 401（业务 JSON）；若拿到 400 说明 body-parser 已崩。
          echo "--- JSON POST 冒烟（期望 401，不能是 400）---"
          post_code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:3002/api/invite/send \
            -H 'Content-Type: application/json' -d '{}')"
          echo "POST /api/invite/send -> ${post_code}"
          [ "${post_code}" != "400" ] || { echo "JSON body 解析已损坏，回滚部署" >&2; exit 1; }

          # ── 轮转旧 release ──────────────────────────────────────────────
          #
          # ⚠️⚠️⚠️ 2026-09-24 真实事故：这里原本没有任何清理逻辑，
          #   而上面第 151 行的注释却写着「releases/ 是会被轮转的临时区」——
          #   一个**从未兑现的假设**。实际后果：12 天堆了 261 个 release，
          #   每个 738MB（其中 node_modules 就占 720MB，dist 只有 18MB），
          #   吃掉 45G，磁盘从 80G 干到只剩 21G（74%）。
          #   ⚠️ 全程零报错、零告警 —— 磁盘写满前没有任何症状，
          #   写满的那一刻是**数据库和上传目录一起挂**。
          #
          # ⚠️ 位置很关键：必须放在上面所有冒烟检查**之后**。
          #   放前面的话，冒烟失败时旧版本已被删光，`current` 无处可回滚。
          #
          # 保留 5 份的理由：够回滚 2-3 个版本，且 5 × 738MB ≈ 3.6G 可控。
          keep_count=5
          rel_dir="${base}/releases"
          cur_name="$(basename "$(readlink -f "${base}/current")")"

          # ⚠️ 三道安全闸，任何一道不过就跳过清理（宁可不清，不可误删现役）
          if [ -z "${cur_name}" ] || [ ! -d "${rel_dir}/${cur_name}" ]; then
            echo "⚠️ 无法确认现役 release，跳过清理" >&2
          elif ! ls -1t "${rel_dir}" | head -n "${keep_count}" | grep -qx "${cur_name}"; then
            echo "⚠️ 现役不在最近 ${keep_count} 个内，跳过清理（需人工介入）" >&2
          else
            ls -1t "${rel_dir}" | tail -n "+$((keep_count + 1))" | while read -r old; do
              # 双保险：即便排序出意外也绝不删现役
              [ "${old}" = "${cur_name}" ] && continue
              # 只删符合命名规范的目录，避免误伤人工放进去的东西
              case "${old}" in
                artx-backstage-*) rm -rf "${rel_dir:?}/${old}" && echo "  已清理 ${old}" ;;
                *) echo "  跳过非预期命名：${old}" ;;
              esac
            done
            echo "轮转完成，现存 $(ls "${rel_dir}" | wc -l) 个 release"
          fi
          df -h / | tail -1
          REMOTE

      - name: Verify public smoke
        env:
          RUN_FULL_SMOKE: ${{ github.event.inputs.run_full_smoke || 'false' }}
        run: |
          ssh -i ~/.ssh/tencent_cloud_deploy_key -p "${SERVER_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            "RUN_FULL_SMOKE='${RUN_FULL_SMOKE}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/artx-gray-backend/current
          set -a
          . ./.env.gray
          set +a
          if [[ "${RUN_FULL_SMOKE}" == "true" ]]; then
            RUN_AUTH=1 RUN_WALLYT_CALLBACK=1 RUN_SKILL_IMAGE=1 \
              BACKEND_URL=https://backstage.artxsd.com \
              PUBLIC_URL=https://backstage.artxsd.com \
              SKILL_TIMEOUT_MS=240000 \
              node scripts/verify-tencent-cloud-gray.mjs
          else
            BACKEND_URL=https://backstage.artxsd.com \
              PUBLIC_URL=https://backstage.artxsd.com \
              node scripts/verify-tencent-cloud-gray.mjs
          fi
          REMOTE

      - name: Verify deployment metadata
        run: |
          metadata="$(curl -fsS https://backstage.artxsd.com/deployment.json)"
          echo "${metadata}"
          printf '%s' "${metadata}" | node -e '
            let input = "";
            process.stdin.on("data", d => input += d);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              if (data.backendUrl !== "https://backstage.artxsd.com") {
                console.error(`Unexpected backendUrl: ${data.backendUrl}`);
                process.exit(1);
              }
            });
          '
