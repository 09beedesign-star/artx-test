name: Deploy GitHub Pages

on:
  push:
    branches:
      - feature/interaction-framework
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_REPO: ${{ github.event.repository.name }}
          VITE_DEPLOY_ENV: github-pages-test
          VITE_DEPLOY_BRANCH: ${{ github.ref_name }}
          VITE_DEPLOY_REPOSITORY: ${{ github.repository }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          VITE_GITHUB_RUN_ID: ${{ github.run_id }}
          VITE_TEST_FRONTEND_URL: https://09beedesign-star.github.io/artx-test/
          VITE_TEST_BACKEND_URL: https://artx-test.onrender.com
          VITE_API_BASE_URL: https://artx-test.onrender.com
          VITE_AUTH_API_BASE_URL: https://artx-test.onrender.com
          VITE_AI_API_BASE_URL: https://artx-test.onrender.com
        run: pnpm exec vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
