name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - gh-pages
      - feature/interaction-framework
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# ⚠️ GitHub Pages 已从「完整应用镜像」降级为「跳转页」。
# 正式站唯一入口是 https://www.artxsd.com（同机 nginx 已把 backstage / 裸域 301 收口）。
# 保留本工作流而不是直接删除，是为了让老收藏夹仍能落地并自动前往新域名，
# 而不是吃一个 GitHub 404。这里刻意不再 pnpm install / vite build：
# 多一个能跑的应用副本 = 多一个会漂移的线上出口。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect page
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
