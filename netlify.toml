[build]
  command = "npx pnpm@10.4.1 install --frozen-lockfile && npx pnpm@10.4.1 build"
  publish = "dist/public"

[build.environment]
  VITE_API_BASE_URL = "https://backstage.artxsd.com"
  VITE_AUTH_API_BASE_URL = "https://backstage.artxsd.com"
  VITE_AI_API_BASE_URL = "https://backstage.artxsd.com"
  VITE_TEST_BACKEND_URL = "https://backstage.artxsd.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
